# One-command local stack: Postgres + Redis + API + Web.
# `docker compose up --build` then open http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fcedge
      POSTGRES_PASSWORD: fcedge
      POSTGRES_DB: fcedge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcedge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://fcedge:fcedge@postgres:5432/fcedge
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
